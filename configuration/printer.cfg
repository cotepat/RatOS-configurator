#############################################################################################################
### CONFIGURATION GENERATED BY THE RATOS CONFIGURATOR
### Everything below [include RatOS.cfg] will override default RatOS behavior
#############################################################################################################
[include RatOS-IDEX.cfg]

#############################################################################################################
### MACRO CONFIGURATION
### Configure the behavior of RatOS macros
### See: https://os.ratrig.com/docs/configuration/macros
#############################################################################################################
#############################################################################################################
# Printing
#############################################################################################################
[gcode_macro RatOS]
variable_relative_extrusion: True
variable_force_absolute_position: False
variable_bed_margin_x: [45.000, 53.134]
# Speed
variable_macro_travel_speed: 500
variable_macro_travel_accel: 10000
# Homing
variable_safe_home_x: "middle"	             # "middle" / number	- The x coordinate for where to return the toolhead to when homing Z
variable_safe_home_y:	"middle"             # "middle" / number	- The y coordinate for where to return the toolhead to when homing Z
variable_home_y_first: False

# Heating
variable_preheat_extruder: True
# Bed Mesh Calibration
variable_calibrate_bed_mesh: True
variable_adaptive_mesh: True
# Nozzle Priming
variable_nozzle_priming: False             # "primeblob" / False
variable_nozzle_prime_start_x: 10       # "min" / "max" / number
variable_nozzle_prime_start_y: "min"       # "min" / "max" / number  
variable_nozzle_prime_direction: "auto"    # "min" / "max" / number
# Parking
variable_start_print_park_in: "front"      # "back" / "center" / "front"
variable_start_print_park_z_height: 50
variable_end_print_park_in: "back"
variable_pause_print_park_in: "front"

# Toolhead configuration
[gcode_macro T0]
variable_enable_insert_detection: True
variable_enable_runout_detection: True
variable_enable_clog_detection: True
variable_unload_after_runout: False         # unload filament after runout has been detected
variable_resume_after_insert: False         # resumes the print after inserting new filament
variable_parking_position: -43.000
variable_loading_position: -22.000
[gcode_macro T1]
variable_enable_insert_detection: True
variable_enable_runout_detection: True
variable_enable_clog_detection: True
variable_unload_after_runout: False         # unload filament after runout has been detected
variable_resume_after_insert: False         # resumes the print after inserting new filament
variable_parking_position: 356.134
variable_loading_position: 331

# VAOC
[gcode_macro _VAOC]
variable_expected_camera_x_position: 207.574
variable_expected_camera_y_position: 329.613
variable_safe_z: 10
variable_toolchange_travel_speed: 500
variable_toolchange_travel_accel: 10000

# IDEX
[gcode_macro RatOS]
variable_auto_center_subject: True
variable_toolchange_travel_speed: 500
variable_toolchange_travel_accel: 10000
variable_toolchange_purge: 25
variable_toolchange_standby_temp: -1      # If configured the toolheads are going into standby mode when parked.
variable_toolchange_first_purge: 50
variable_shaper_x_freq: [59.6, 59.6, 63.2, 62.4]                   # shaper frequency [T0, T1, COPY, MIRROR]
variable_shaper_y_freq: [32.2, 32.2, 32.2, 32.2]                   # shaper frequency [T0, T1, COPY, MIRROR]
variable_shaper_x_type: ["zv", "zv", "zv", "zv"]   # shaper frequency algorythm [T0, T1, COPY, MIRROR]
variable_shaper_y_type: ["mzv", "mzv", "mzv", "mzv"]   # shaper frequency algorythm [T0, T1, COPY, MIRROR]

# Beacon probe
[gcode_macro RatOS]
variable_beacon_contact_z_homing: False
variable_beacon_contact_z_calibration: False
variable_beacon_contact_bed_mesh: False
variable_beacon_contact_expansion_compensation: True
variable_beacon_contact_start_print_true_zero: True
variable_beacon_contact_wipe_before_true_zero: True 
variable_beacon_contact_prime_probing: False             # Probes for priming with contact method

# Chamber filter
[gcode_macro RatOS]
variable_chamber_filter_enable: True                     # True|False = enable chamber filter control
variable_chamber_filter_speed: 0.7                       # float = chamber filter fan speed.
variable_chamber_filter_disable_speed: 1.0               # float = chamber filter fan speed after the print has finished.
variable_chamber_filter_enable_at: "before_print_start"  # before_print_start|after_print_start|print_end = when to enable the filter
variable_chamber_filter_disable_period: 300              # int = disable fan after X seconds after the print ends
variable_chamber_filter_disable_bed_temp: 0              # int = wait for X°C bed temp after the print ends before disabling the filter

# Chamber heater
[gcode_macro RatOS]
variable_chamber_heater_enable: True                      # Enable/disable chamber heater control
variable_chamber_heater_bed_temp: 115                     # Bed temperature during chamber preheating (°C)
variable_chamber_heater_preheating_temp: 0                # Generic heater temperature for chamber preheating (°C)
variable_chamber_heater_heating_temp_offset: 0            # Temperature offset for generic heater while printing (°C)
variable_chamber_heater_control_external_heater: False    # Enable automatic control for external heater devices
variable_chamber_heater_air_circulation_enable: True      # Use part cooling for air circulation during preheating
variable_chamber_heater_air_circulation_fan_speed: 0.35   # Part cooling fan speed for air circulation (0.0-1.0)
variable_chamber_heater_air_circulation_y_pos: 150         # Toolhead Y-position for air circulation
variable_chamber_heater_air_circulation_z_pos: 100        # Toolhead Z-position for air circulation
variable_chamber_heater_extra_fan_speed: 0.0              # Extra chamber heater fan speed (0.0-1.0)
variable_chamber_heater_filter_fan_speed: 1.0             # Filter fan speed for air circulation (0.0-1.0)

#############################################################################################################
### USER OVERRIDES & CUSTOM CONFIGURATION
### Anything custom you want to add, or RatOS configuration you want to override, do it here.
### This section is pre-populated with the most common settings you may want to change.
### See: https://os.ratrig.com/docs/configuration/includes-and-overrides
###
### It is recommended that you follow these steps to properly calibrate your printer:
### 0) Sanity check and PID Tuning: https://www.klipper3d.org/Config_checks.html
### 1) Z-offset calibration: run BEACON_RATOS_CALIBRATE to automatically calibrate your beacon for scan and contact.
###    IMPORTANT: Ensure the beacon is properly mounted and the nozzle and meltzone is clean by unloading
###    the filament (if it's loaded) and make sure there's no ooze or gunk on the nozzle when the hotend is at printing temperature.
### 2) Pressure Advance: https://www.klipper3d.org/Pressure_Advance.html
### 3) Skew Correction: https://www.klipper3d.org/Skew_Correction.html
### 4) Resonance Compensation: https://www.klipper3d.org/Resonance_Compensation.html
### RatOS has dedicated macro's to generate shaper graphs for deeper analysis (requires accelerometer).
### Use GENERATE_SHAPER_GRAPHS to generate the resonance graphs for analysing and manually entering input
### shaper configuration.
### You can run SHAPER_CALIBRATE to automatically calibrate your input shaper configuration, if you just want
### to get started.
### Additionally, you can use the Realtime Analysis Tool to analyze your printer's performance in real-time.
### Read more about klipper here: https://www.klipper3d.org/Overview.html
#############################################################################################################

#---------------------------------------------------- X -----------------------------------------------------
# The X axis motor moves the print head left and right.
#------------------------------------------------------------------------------------------------------------
[stepper_x]
dir_pin: x_dir_pin        # Remove ! in front of pin name to reverse the direction of stepper_x
rotation_distance: 40      # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 100
position_min: -45
position_max: 305
position_endstop: -45

#---------------------------------------------- DUAL_CARRIAGE -----------------------------------------------
# The X axis motor for the right toolhead, located at the rear right of the printer
#------------------------------------------------------------------------------------------------------------
[dual_carriage]
dir_pin: dual_carriage_dir_pin     # Add ! in front of pin name to reverse the direction of dual_carriage
axis: x
rotation_distance: 40              # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
position_min: 0
safe_distance: 50
position_max: 358.134
position_endstop: 358.134

#---------------------------------------------------- Y -----------------------------------------------------
# The Y axis motor moves the print bed forward and backward.
#------------------------------------------------------------------------------------------------------------
[stepper_y]
dir_pin: !y_dir_pin        # Remove ! in front of pin name to reverse the direction of stepper_y
rotation_distance: 40      # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 50
position_min: 0
position_max: 337
position_endstop: 0

#---------------------------------------------------- Z -----------------------------------------------------
# The left Z axis motor moves the left side of the x rail up and down.
#------------------------------------------------------------------------------------------------------------
[stepper_z]
dir_pin: !z0_dir_pin       # Remove ! in front of pin name to reverse the direction of stepper_z
rotation_distance: 8       # 4 for TR8*4 lead screws
homing_speed: 10
position_min: -7
position_max: 300

#---------------------------------------------------- Z1 ----------------------------------------------------
# The right Z axis motor moves the right side of the x rail up and down.
#------------------------------------------------------------------------------------------------------------
[stepper_z1]
dir_pin: z1_dir_pin       # Remove ! in front of pin name to reverse the direction of stepper_z1
rotation_distance: 8       # 4 for TR8*4 lead screws
#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for pushing filament through the left toolhead (T0)
#------------------------------------------------------------------------------------------------------------
[extruder]
dir_pin: !e_dir_pin  # Add ! in front of pin name to reverse the direction of extruder
#rotation_distance: 24.35   # Phaetus Apus default is 24.35 with a gear ratio of (?)
gear_ratio: 1:1
rotation_distance: 4.263
pressure_advance: 0.03     # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
nozzle_diameter: 0.6

#------------------------------------------------ EXTRUDER1 -------------------------------------------------
# The extruder motor used for pushing filament through the right toolhead (T1)
#------------------------------------------------------------------------------------------------------------
[extruder1]
dir_pin: !e1_dir_pin   # Add ! in front of pin name to reverse the direction of extruder1
#rotation_distance: 24.35   # Phaetus Apus default is 24.35 with a gear ratio of (?)
gear_ratio: 1:1
rotation_distance: 4.263
pressure_advance: 0.03     # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
nozzle_diameter: 0.6

#############################################################################################################
### OTHER STUFF ADDED BY ME
#############################################################################################################
[ratos]
enable_gcode_transform: True
allow_unsupported_slicer_versions: True

# Controller cooling fan
[controller_fan controller_fan]
fan_speed: 0.50 

[bed_mesh]
horizontal_move_z: 7
mesh_min: 5,27.5
mesh_max: 295,295

[z_tilt]
z_positions:
	-90,150
	395,150
points:
	20,150
	280,150
horizontal_move_z: 5

[z_offset_probe]
pin: ^PG10                     # probe trigger pin    
z_offset: -7                   # probe height, used to limit the probe z-move
y_offset: 0                    # probe y-offset, measured from the camera centre
x_offset: 37.5                 # probe x-offset, measured from the camera centre
speed: 10                      
samples: 3                     # number of samples  
sample_retract_dist: 5
lift_speed: 10.0
samples_result: median
samples_tolerance: 0.2
samples_tolerance_retries: 5

[filament_switch_sensor bowden_filament_sensor_t0]
pause_on_runout: False
event_delay: 0.1
switch_pin: ^PG12
runout_gcode:
  M117 Filament runout on T0
  _ON_BOWDEN_FILAMENT_SENSOR_RUNOUT TOOLHEAD=0
  SET_IDLE_TIMEOUT timeout=43200
insert_gcode:
  M117 Filament inserted on T1 (switch)
  _ON_BOWDEN_FILAMENT_SENSOR_INSERT TOOLHEAD=0
  SET_IDLE_TIMEOUT timeout=7200

[filament_switch_sensor bowden_filament_sensor_t1]
pause_on_runout: False
event_delay: 0.1
switch_pin: ^PG14
runout_gcode:
  M117 Filament runout on T1
  _ON_BOWDEN_FILAMENT_SENSOR_RUNOUT TOOLHEAD=1
  SET_IDLE_TIMEOUT timeout=43200
insert_gcode:
  M117 Filament inserted on T1 (switch)
  _ON_BOWDEN_FILAMENT_SENSOR_INSERT TOOLHEAD=1
  SET_IDLE_TIMEOUT timeout=7200

[filament_motion_sensor bowden_filament_clog_t0]
switch_pin: !PG13
detection_length: 6
extruder: extruder   # extruder for T0, extruder1 for T1
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
  M117 Filament clog detected on T0
  _ON_BOWDEN_FILAMENT_SENSOR_CLOG TOOLHEAD=0
  SET_IDLE_TIMEOUT timeout=43200
insert_gcode:
  SET_IDLE_TIMEOUT timeout=7200

[filament_motion_sensor bowden_filament_clog_t1]
switch_pin: !PG15
detection_length: 6
extruder: extruder1   # extruder for T0, extruder1 for T1
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
  M117 Filament clog detected on T1
  _ON_BOWDEN_FILAMENT_SENSOR_CLOG TOOLHEAD=1
  SET_IDLE_TIMEOUT timeout=43200
insert_gcode:
  SET_IDLE_TIMEOUT timeout=7200

