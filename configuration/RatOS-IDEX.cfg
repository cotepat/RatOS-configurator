stealthchop_threshold: 0
interpolate: False
uart_pin: PE4
run_current: 0.8
driver_TBL: 1
driver_TOFF: 3
driver_HEND: 3
driver_HSTRT: 0
sense_resistor: 0.11

[stepper_z]
